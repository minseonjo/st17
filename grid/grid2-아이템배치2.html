<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>grid2 - 아이템 배치2</title>
    <link rel="stylesheet" href="../reset.css">
    <!-- 
    grid
    1. container에게 grid 선언 (container)
    2. 행/열 줄/칸 개수, 크기 정하기 (container)
    3. 암시적 그리드 선언 (생략 가능)(container)
    4. 아이템 배치 (생략시 한 줄 한 칸)(item)
    5. 여백
    6. 정렬
    -->
    <style>
        /* 모양 */
        .wrap{
            margin: 50px;
        }
        .grid-container{
            background-color: #ccc;
        }
        .grid-container .item{
            background-color: dodgerblue;
            box-sizing: border-box;
            border: 4px solid magenta;
        }

        /* grid */
        .grid-container{
            display: grid;
            grid-template-rows: repeat(3, 100px);
            grid-template-columns: repeat(4, 1fr);
        }
        /* grid item */
        /* display: grid; 요소의 직계 자식만이 grid item */
        .grid-container .item{}
        .grid-container .item:nth-child(1){
            grid-column: 1/5;
            grid-column: 1/-1;
            grid-column: 1/span 4;
        }
        .grid-container .item:nth-child(2){
            grid-column: 1/3;
            grid-column: 1/span 2;
        }
        .grid-container .item:nth-child(3){
            grid-column: 1/span 2;
        }
        .grid-container .item:nth-child(4){
            grid-row: 2/4;
            /* grid-row: 2/span 2; */
            grid-column: 3/4;
            grid-column: 3;
        }
        .grid-container .item:nth-child(5){
            grid-row: 2/span 2;
            grid-column: 4;
        }
        .grid-container .item:nth-child(6){
        }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="grid-container">
            <div class="item">아이템1</div>
            <div class="item">아이템2</div>
            <div class="item">아이템3</div>
            <div class="item">아이템4</div>
            <div class="item">아이템5</div>
            <div class="item">아이템6</div>
            <div class="item">아이템7</div>
            <div class="item">아이템8</div>
        </div>
    </div>
</body>
</html>
