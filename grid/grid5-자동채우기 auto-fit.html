<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>grid5 - 자동 채우기 (auto-fit/auto-fill)</title>
    <link rel="stylesheet" href="../reset.css">
    <!-- 
    grid
    1. container에게 grid 선언 (container)
    2. 행/열 줄/칸 개수, 크기 정하기 (container)
    3. 암시적 그리드 선언 (생략 가능)(container)
    4. 아이템 배치 (생략시 한 줄 한 칸)(item)
    5. 여백
    6. 정렬
    -->
    <style>
        /* 모양 */
        .wrap{
            margin: 50px;
        }
        .grid-container{
            background-color: #ccc;
        }
        .grid-container .item{
            background-color: dodgerblue;
        }

        /* grid */
        .grid-container{
            display: grid;
            /* 2 행열 개수, 크기 */
            /* repeat(반복횟수, 크기) */
            /* 
            repeat(자동 채우기 예약어, 크기) 
            자동 채우기 예약어
            빈 아이템일 때 어떻게 처리되는지 확인
            auto-fill
            auto-fit
            */
            grid-template-columns: repeat(auto-fill, 100px);
            grid-template-columns: repeat(auto-fit, 100px);
            grid-template-columns: repeat(auto-fill, minmax(100px, auto));
            grid-template-columns: repeat(auto-fit, minmax(100px, auto));
            grid-template-columns: repeat(auto-fit, minmax(320px, auto));
            grid-template-columns: repeat(auto-fill, minmax(320px, auto));
            /* 3, 4 기본값 */
            /* 5 여백 */
            gap: 20px 20px;
        }
        /* grid item */
        .grid-container .item{
            aspect-ratio: 1/1;
        }
        .grid-container .item:nth-child(1){
        }
        .grid-container .item:nth-child(2){
        }
        .grid-container .item:nth-child(3){
        }
        .grid-container .item:nth-child(4){
        }
        .grid-container .item:nth-child(5){
        }
        .grid-container .item:nth-child(6){
        }
    </style>
</head>
<body>
    <div class="wrap">
        <h1>@media 없이 반응형으로 작성 - auto-fit</h1>
        <div class="grid-container">
            <div class="item">아이템1</div>
            <div class="item">아이템2</div>
            <div class="item">아이템3</div>
            <div class="item">아이템4</div>
            <div class="item">아이템5</div>
            <div class="item">아이템6</div>
            <div class="item">아이템7</div>
            <div class="item">아이템8</div>
        </div>
    </div>
</body>
</html>
