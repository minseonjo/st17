<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>grid1 - 행열의 크기 지정 키워드</title>
    <link rel="stylesheet" href="../reset.css">
    <!-- 
    grid
    1. container에게 grid 선언 (container)
    2. 행/열 줄/칸 개수, 크기 정하기 (container)
    3. 암시적 그리드 선언 (생략 가능)(container)
    4. 아이템 배치 (생략시 한 줄 한 칸)(item)
    5. 여백
    6. 정렬
    -->
    <style>
        /* 모양 */
        .wrap{
            margin: 50px;
        }
        .grid-container{
            background-color: #ccc;
        }
        .grid-container .item{
            background-color: dodgerblue;
            border: 1px solid magenta;
            box-sizing: border-box;
        }

        /* grid */
        .grid-container{
            display: grid;
            /* 2 */
            grid-template-rows: repeat(3, 100px);
            /* 크기 auto : 컨테이너에 남은 공간 */
            grid-template-columns: 100px auto 2rem;
            /* fr */
            grid-template-columns: 1fr 1fr 1fr 1fr;
            grid-template-columns: 3fr 3fr 3fr 3fr;
            /* repeat() */
            grid-template-columns: repeat(4, 3fr);
            /* 
            minmax(최솟값, 최댓값) 
            최솟값 fr 단위를 사용하지 못한다
            */
            grid-template-columns: repeat(4, minmax(150px, 1fr));
            grid-template-columns: repeat(4, minmax(150px, 200px));
            grid-template-columns: repeat(3, minmax(150px, 33.33%));
            /* fit-content(최대 크기) 
            아이템의 내용이 최대 크기보다 크지 않을 경우는 content(내용)에 맞추고, 내용이 제한한 최대 크기보다 커질 때는 최대 크기만 유지(더 이상 커지지 말아라)
            */
            /* 300px보다 아이템의 내용이 작을 경우 내용 크기, 아니면 300px 이상은 커지지 말아라 */
            grid-template-columns: repeat(3, fit-content(300px));
        }
        /* grid item */
        .grid-container .item{}
        .grid-container .item:nth-child(1){
        }
        .grid-container .item:nth-child(2){
        }
        .grid-container .item:nth-child(3){
        }
        .grid-container .item:nth-child(4){
        }
        .grid-container .item:nth-child(5){
        }
        .grid-container .item:nth-child(6){
        }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="grid-container">
            <div class="item">Lorem ipsum dolor sit.</div>
            <div class="item">Lorem ipsum dolor sit amet, consectetur adipisicing elit. A, laboriosam.</div>
            <div class="item">아이템3</div>
            <div class="item">아이템4</div>
            <div class="item">아이템5</div>
            <div class="item">아이템6</div>
            <div class="item">아이템7</div>
            <div class="item">아이템8</div>
        </div>
    </div>
</body>
</html>
