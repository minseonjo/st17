<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>목록 관련 CSS</title>
    <style>
        *{margin: 0; padding: 0;}
        body{margin: 30px;}
        li{background-color: #ccc;}
        /* 
        .exam1 ul, .exam1 ol
        .exam1의 후손 ul, .exam1의 후손 ol
        */
        /* 
        ul.exam1, ol.exam1 
        ol 중 클래스 exam1, ul 중 클래스 exam1
        */
        ul.exam1, ol.exam1{
            border: 1px solid #f00;
            /* 글머리표는 ul과 ol의 padding 영역 */
            padding-left: 3em;
            /* 
            ul, ol의 블릿 글머리표가 화면에 표시되는 게 문제일 때는 padding-left 확인
            */
            overflow: hidden;
            list-style: decimal;
            list-style: circle;
            /* ul, ol의 글머리표를 사용 X */
            list-style: none;
        }
    </style>
</head>
<body>
    <!-- ul>li*3>{menu$} -->
    <ul class="exam1">
        <li>menu1</li>
        <li>menu2</li>
        <li>menu3</li>
    </ul>
    <ol class="exam1">
        <li>menu1</li>
        <li>menu2</li>
        <li>menu3</li>
    </ol>
    <!-- .exam2>ol>li*3>{내용$} -->
    <div class="exam2">
        <ol>
            <li>내용1</li>
            <li>내용2</li>
            <li>내용3</li>
        </ol>
        <ul>
            <li>내용1</li>
            <li>내용2</li>
            <li>내용3</li>
        </ul>
    </div>
    <style>
        .exam2 ol, .exam2 ul{
            /* 목록 태그들의 글머리표 제거 */
            list-style: none;
        }
        .exam2 li{
            /* 요소가 이미지의 크기보다 크면 이미지가 반복 -> 기본값 */
            padding-left: 20px;
            /* background-image: url(images/arrow-right.png);
            background-repeat: no-repeat;
            background-size: 12px;
            background-position: 0 6px; */
            /* 
            단축표기법
            background: bg-color bg-image position/bg-size bg-repeat bg-attachment
            */
            /* padding-left: 20px; */
            /* 단축표기법을 사용시 생략된 속성은 기본값으로 설정 */
            background: url(images/arrow-right.png) no-repeat 0 6px/12px;
        }
    </style>
</body>
</html>
