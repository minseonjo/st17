<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>transform2</title>
    <style>
        *{margin: 0; padding: 0;}
        .wrap{
            width: 80%;
            margin: 50px;
            background-color: beige;
        }
        /* float가 지정된 요소가 일반 흐름에서 제외되는 문제를 해결하기 위한 css 선택자와 속성값 */
        .wrap::after{
            content: "";
            display: block;
            clear: both;
        }
        .box{
            width: 50px;
            height: 50px;
            /* normal flow에서 제외 */
            float: left;
        }
        .box:nth-child(odd){
            background-color: #f86;
        }
        .box:nth-child(even){
            background-color: #8f6;
        }
        .box1{
            /* transform: translate(30px, 0); */
            /* transform: scale(200%,100%); */
            transform: rotate(45deg);
        }
        .box2{
            /* transform: translateY(50px); */
            /* transform: scale(200%, 100%); */
            /* 밑에 있는 요소가 상위 레이어가 됨 */
            /* 
            transform-origin 
            요소를 변형할 때 기준이 되는 지점 
            transform 속성이 적용된 요소의 원래 위치를 기준으로 작용
            */
            /* transform-origin: right top; */
            /* rotate 중심을 기준으로 */
            transform: rotate(45deg);
            transform-origin: left bottom;
        }
        .box3{
            /* x축으로 skew */
            transform: skew(45deg, 0);
        }
        .box4{
            /* y축으로 skew */
            transform: skew(0, 45deg);
        }
        /* transform 속성이 지정되면 position이 fixed, absolute인 요소의 기준요소가 된다 */
    </style>
</head>
<body>
    <div class="wrap">
        <!-- .box.box$*4>{box$} -->
        <div class="box box1">box1</div>
        <div class="box box2">box2</div>
        <div class="box box3">box3</div>
        <div class="box box4">box4</div>
    </div>
</body>
</html>
