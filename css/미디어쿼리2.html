<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>미디어쿼리2 media query</title>
    <style>
        *{margin: 0; padding: 0;}
        ol,ul{list-style: none;}
        a:link,
        a:visited,
        a:active{
            /* 해당 요소의 지정된 컬러를 따르겠다 */
            color: currentColor;
            /* text-decoration: none; */
            text-decoration: underline;
        }
        a:hover{
            color: #f00;
            text-decoration: underline;
        }
        header{
            background-color: #ccc;
        }
        /* 3 정렬 */
        header .inner{
            width: 90%;
            max-width: 1400px;
            margin: 0 auto;
            background-color: #6cc;
        }
        /* 2 .inner의 자식 요소들의 float 지정으로 인해 인식 못하는 문제 해결 */
        header .inner::after{
            content: "";
            display: block;
            clear: both;
        }

        /* 
        블록레벨을 한 줄로 표현할 수 있는 방법
        방법1 float
        방법2 display: inline-block;
        */
        /* 1 블록레벨 .logo, .gnb-wrap, .util, .m-nav-btn 한 줄로 표시 */
        header .logo,
        header .gnb-wrap{
            float: left;
        }
        header .util,
        header .m-nav-btn{
            float: right;
        }
        header .gnb-wrap{
            background-color: #cfc;
            /* logo와 gnb-wrap 사이 여백 */
            margin-left: 50px;
            display: block;
        }
        header .gnb-wrap ul.gnb{}
        
        /* 4 .gnb 메뉴가 한 줄로 표시 */
        /* 블록레벨인 li를 한 줄로 */
        header .gnb-wrap .gnb li{
            display: inline-block;
            padding: 0.5em 1em;
            background-color: #fff;
            /* 한 글자만큼 여백 */
            margin-right: 1em;
        }
        header .gnb-wrap .gnb li a{}
        header .util{}
        header .util a{
            padding: 0.5em 1em;
            background-color: #fff;
            /* 한 글자만큼 여백 */
            margin-left: 1em;
            /* 인라인은 수직에 관련된 여백 관리 어려움 */
            display: inline-block;
        }
        /* 햄버거 메뉴를 1024 이상에서는 표시 X
        1024 이하에서만 표시 */
        header .m-nav-btn{
            /* display: none; */
        }
        /* 장비에 따라 스타일시트를 별도로 작성 -> 미디어쿼리 */
        @media (min-width: 1025px){
            /* 장비 특성에 맞는 클래스명으로 display를 지정하는 것을 권해요 */
            .mobile-only-block{
                display: none;
            }
        } /* @media (min-width: 1025px) */
        
        @media (max-width: 1024px){
            /* 장비의 특정 조건에 따라 표시 설정 */
            /* 오래된 미디어쿼리 작성법 */
            .pc-only{
                display: none !important;
            }
            /* 장비 특성에 맞는 클래스명으로 display를 지정하는 것을 권해요 */
            .mobile-only-block{
                display: block;
            }
        } /* @media (max-width: 1024px) */
    </style>
</head>
<body>
    <div class="wrap">
        <header>
            <!-- 정렬에 해당되는 기준점 -->
            <div class="inner">
                <h1 class="logo">CHOI</h1>
                <nav class="gnb-wrap pc-only">
                    <ul class="gnb">
                        <!-- li*5>a>{menu$} -->
                        <li><a href="">menu1</a></li>
                        <li><a href="">menu2</a></li>
                        <li><a href="">menu3</a></li>
                        <li><a href="">menu4</a></li>
                        <li><a href="">menu5</a></li>
                    </ul>
                </nav>
                <!-- div.util>a*3>{상단기능메뉴$} -->
                <div class="util"><a href="">상단기능메뉴1</a><a href="">상단기능메뉴2</a><a href="">상단기능메뉴3</a></div>
                <!-- //.util -->
                <!-- div.m-nav-btn.moblie-only -->
                <div class="m-nav-btn mobile-only-block">
                    <img src="images/menu.png" alt="모바일 사이드 메뉴 펼치기">
                </div>
            </div>
            <!-- //.inner -->
        </header>
    </div>
    <!-- //.wrap -->
</body>
</html>
