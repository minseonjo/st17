<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>배경이미지 활용</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&family=Noto+Sans+KR:wght@100..900&display=swap" rel="stylesheet">
    <!-- 
    .noto-sans-kr-<uniquifier> {
    font-family: "Noto Sans KR", sans-serif;
    font-optical-sizing: auto;
    font-weight: <weight>;
    font-style: normal;
    }
    -->
    <!-- 
    .nanum-pen-script-regular {
    font-family: "Nanum Pen Script", cursive;
    font-weight: 400;
    font-style: normal;
    }
    -->

    <style>
        *{margin: 0; padding: 0;}
        .wrap{}
        .visual-section{
            /* 
            width: 100vw; 쓰지 않는 이유
            100vw는 스크롤바를 합친 크기를 사용 
            
            width: 100%;는 
            부모의 콘텐츠 영역을 다 사용, 부모가 쓸 수 있는 크기만큼만, 즉 스크롤바를 뺀 크기만큼 사용
            viewport의 크기를 다 사용 
            */
            width: 100%;
            height: 100vh;
            background-color: #97948d;
            background-image: url(../images/background-test.jpg);
            background-repeat: no-repeat;
            /* background-position: center; */
            background-position: right top;
            /* background-size: contain; */
            /* background-size: cover; */
            background-size: auto 200vh;
            /* 자식 inline-block을 가운데 정렬 */
            text-align: center;
            align-content: center;
            /* .visual-section::after의 기준요소를 위해 */
            position: relative;
        }
        /* 
        visual-section::after 레이어보다 text-wrap 레이어를 상위에 위치하게 하고 싶을 때

        visual-section::after는 position: absolute;에 의해 레이어가 되었지만, text-wrap은 레이어가 아니기 때문에 position: relative; 작성해서 레이어로 만들어 준다
        -> z-index로 각각 상위, 하위 레이어 지정해서 text-wrap 레이어가 visual-section::after 레이어보다 더 상위에 위치하도록 해준다

        온전히 레이어만 쓰고 싶을 때는 position: relative;를 주면 된다
        
        z-index
        숫자가 높으면, 상위 레이어
        숫자가 낮으면, 하위 레이어
        */
        .visual-section::after{
            content: "";
            background-color: rgba(0, 255, 255, 0.5);
            /* width: 50px; */
            /* height: 100px; */
            width: 100%;
            height: 100%;
            /* block 요소는 너비/높이 지정 가능 */
            display: block;
            /* z-index 레이어 순서 관리 */
            /* normal flow에서 벗어남 -> 부모가 자식을 인식 못함 */
            position: absolute;
            left: 0;
            top: 0;
            z-index: 10;
        }
        .visual-section .text-wrap{
            /* z-index 레이어 순서 관리 */
            position: relative;
            z-index: 20;
            display: inline-block;
            width: 50%;
            padding: 1rem 2rem;
            /* inline-block이기 때문에 적용되지 않는다 */
            /* margin: 0 auto; */
            background-color: rgba(0, 0, 0, 0.5);
            font-family: "Noto Sans KR", sans-serif;
            color: #8bffb7;
        }
        .visual-section .text-wrap .title{
            /* font-는 상속받음 */
            /* font-family: "Noto Sans KR", sans-serif; */
            font-size: 4rem;
            font-weight: 100;
            /* color: #8bffb7; */
        }
        .visual-section .text-wrap .desc{
            /* font-family: "Noto Sans KR", sans-serif; */
            font-size: 1rem;
            font-weight: 200;
            /* color: #8bffb7; */
        }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="visual-section">
            <!-- .text-wrap>p.title>lorem3^p.desc>lorem20 -->
            <div class="text-wrap">
                <p class="title">Lorem, ipsum dolor.</p>
                <p class="desc">Lorem ipsum dolor sit amet consectetur adipisicing elit. <br>Laborum ex id eum sunt corporis, explicabo incidunt quos quisquam sed reiciendis?</p>
            </div>
        </div>
    </div>
</body>
</html>
