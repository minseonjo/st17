<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>히어로배너</title>
    <style>
        *{margin: 0; padding: 0;}
        /* 
        hero-banner의 부모의 콘텐츠 영역 너비를 다 사용
        .wrap의 콘텐츠 영역 너비를 다 사용
        */
        .hero-banner{
            width: 100%;
        }
        .hero-banner picture{
            display: block;
            background-color: #f00;
        }
        .hero-banner picture source,
        .hero-banner picture img{
            width: 100%;
            /* 기본값 */
            /* height: auto; */
            display: block;
        }
        
        @media (max-width: 768px){
            .hero-banner picture source,
            .hero-banner picture img{
            opacity: 0.5;
            width: 100%;
            /* height: 100vh; */
            /* 헤더의 크기 : 50px, 모바일용 네비게이션 : 50px */
            height: calc(100vh - (50px + 50px));
            object-fit: cover;
            /* 화면이 줄어들 때 왼쪽 아래에 있는 버튼이 사라지지 않게끔 */
            object-position: left bottom;
        }
        } /* @media (max-width: 768px) */
    </style>
</head>
<body>
    <div class="wrap">
        <div class="hero-banner">
            <!-- 
            picture 태그는 자식인 source 태그 입력 순으로 브라우저에 표시할 수 있는지 여부를 확인하고, 할 수 없으면 다음 source를 표시하려고 하고, 안 되면 또 다음으로 계속 넘어간다.
            모든 source를 표시할 수 없으면 최종 image를 적용
            적용 여부 media=""(미디어쿼리)로 결정
            -->
            <picture>
                <source srcset="../images/smartbanner-01-02-mobile.png" media="(max-width: 768px)">
                <img src="../images/smartbanner-01-01-pc.png" alt="">
            </picture>
        </div>
    </div>
</body>
</html>
