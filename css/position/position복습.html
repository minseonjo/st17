<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>position 복습</title>
    <style>
        *{margin: 0; padding: 0;}
        .wrap{
            margin: 50px;
            background-color: #ccc;
            padding: 20px;
            position: relative;
        }
        .wrap .section{
            background-color: #ddd;
            padding: 20px;
            position: relative;
        }
        .wrap .section .parent{
            background-color: beige;
            padding: 20px;
            position: relative;
        }
        .wrap .section .parent .child:nth-child(1){
            background-color: magenta;
            padding: 10px;
            width: 50px;
            height: 50px;
            box-sizing: border-box;
            top: 0;
            left: 0;
            /* 기준 : 브라우저 */
            /* position: fixed; */
            /* 가까운 조상 중 position: static 제외한 값이 설정된 조상 기준 */
            position: absolute;
        }
        .wrap .section .parent .child:nth-child(2){
            background-color: cyan;
            padding: 10px;
            width: 50px;
            height: 50px;
            /* 베이지 배경에 오른쪽 위에 배치 */
            /* right: 0 오른쪽에 딱 붙어라 */
            right: 0px;
            top: 0px;
            /* bottom: center; */
            /* 기준 : 원위치 */
            position: relative;
            /* 기준 : 브라우저 */
            position: fixed;
            /* 기준 : 가까운 조상 중에 position: static 제외한 값으로 설정되어 있는 요소 */
            position: absolute;
        }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="section">
            <div class="parent">
                <div class="child">child1</div>
                <div class="child">child2</div>
            </div>
        </div>
    </div>
</body>
</html>
