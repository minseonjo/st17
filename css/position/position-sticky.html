<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>position sticky</title>
    <style>
        *{margin: 0; padding: 0;}
        /* 홀수번째 */
        .section:nth-child(odd){
            background-color: #68f;
        }
        /* 짝수번째 */
        .section:nth-child(even){
            background-color: #f86;
        }
        .section-title, .content-wrap{
            width: 80%;
            margin: 0 auto;
            box-sizing: border-box;
        }
        .section{
            overflow: hidden;
            /* 부모가 overflow: visible을 제외하고 overflow가 선언되어 있으면 자식 요소는 sticky 작동 X */
        }
        /* 
        브라우저에 해당 section이 보여지는 동안 section-title이 브라우저 상단에 고정
        
        누가? .section-title
        배치법? position: fixed;
        위치? 상단 고정
        top: 0;
        기준? 브라우저
        : 브라우저가 위치의 기준
        : 조건 -> section이 보이는 동안
        : section이 보이는 동안 section-title이 상단에 고정
        : 부모 요소가 브라우저에서의 위치가 어떻게 되는지? -> left/right/top/bottom
        */
        .section .section-title{
            background-color: #fff;
            /* height: 50px; */
            /* line-height 두 줄 이상일 때 줄 간 간격 */
            /* 한 줄 텍스트를 수직으로 가운데 오기 */
            /* 높이를 고정, 글자 수직 가운데 */
            /* line-height: 50px; */
            font-size: 2em;
            /* 글자 크기에 따라 수직 크기가 달라짐 */
            padding: 1em 2em;
            /* position: fixed; */
            position: sticky;
            /* 부모의 요소의 브라우저 위치가 만나는 지점 */
            /* 부모가 지정한 위치에서 만날 때 */
            /* 부모의 위치가 만나는 지점 */
            /* 본인 요소가 처음 위치할 지점 */
            top: 50px;
            /* top: 0; */
        }
        .section .content-wrap{
            background-color: beige;
            height: 120vh;
        }
    </style>
</head>
<body>
    <div class="wrap">
        <!-- .section.section$*4>p.section-title+.content-wrap -->
        <div class="section section1">
            <p class="section-title">section1</p>
            <div class="content-wrap"></div>
        </div>
        <div class="section section2">
            <p class="section-title">section2</p>
            <div class="content-wrap"></div>
        </div>
        <div class="section section3">
            <p class="section-title">section3</p>
            <div class="content-wrap"></div>
        </div>
        <div class="section section4">
            <p class="section-title">section4</p>
            <div class="content-wrap"></div>
        </div>
    </div>
</body>
</html>
