<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>position1</title>
    <style>
        *{margin: 0; padding: 0; box-sizing: border-box;}
        .wrap{
            /* 부모의 콘텐츠 영역에서 65%를 쓰겠다 */
            width: 65%;
            /* width: 350px; */
            min-height: 2000px;
            margin: 0 auto;
            background-color: #ccc;
            padding: 30px;
            border: 10px dashed #999;
            /* 세 번째 parent의 기준 요소 */
            position: relative;
        }
        .parent{
            padding: 10px;
        }
        .parent:nth-child(1){
            background-color: #f86;
            position: static;
            /* 기준 X */
            /* normal flow O */
            /* 레이어 X */
            left: 150px;
            top: 150px;
        }
        .parent:nth-child(2){
            background-color: #6f8;
            position: relative;
            /* 기준은 자신*/
            /* 형제와 부모에게 레이아웃의 영향을 주지 않음 -> nomal flow O */
            /* 레이어 요소가 된다 -> z-index로 관리 */
            left: 150px;
            top: 150px;
        }
        .parent:nth-child(3){
            background-color: #86f;
            position: absolute;
            /* 기준을 가까운 조상의 position: static을 제외한 값을 가진 요소 */
            /* 형제, 부모의 레이아웃에 영향을 줌 -> normal flow X */
            /* 
            normal flow X -> 부모, 자식의 관계를 잃음 -> 부모가 해당 요소의 높이를 인식하지 X, 부모의 너비를 알지 X -> 콘텐츠 영역만큼의 너비(너비가 콘텐츠 영역만큼 줄어든다) */
            /* 레이어 요소가 된다 -> z-index로 관리 */
            /* left/right/top/bottom을 지정하지 않으면 원래 자기 위치 */
            /* 기준 요소의 padding 영역의 시작점을 기준으로 위치를 잡는다 */
            left: 0;
            top: 0;
        }
        .parent:nth-child(4){
            background-color: #cf6;
            position: fixed;
            /* 기준을 브라우저 */
            /* 형제, 부모의 레이아웃에 영향을 줌 -> normal flow X */
            /* 
            normal flow X -> 부모, 자식의 관계를 잃음 -> 부모가 해당 요소의 높이를 인식하지 X, 부모의 너비를 알지 X -> 콘텐츠 영역만큼의 너비(너비가 콘텐츠 영역만큼 줄어든다) */
            /* 레이어 요소가 된다 -> z-index로 관리 */
            /* left/right/top/bottom을 지정하지 않으면 원래 자기 위치 */
            left: 0;
            top: 0;
        }
        .parent:nth-child(5){
            background-color: #c8f;
        }
        .parent .child{
            width: 50px;
            height: 50px;
            padding: 10px;
            position: absolute;
            /* 
            normal flow에서 벗어남
            부모가 해당 요소의 높이를 인식하지 못한다
            본인의 너비를 부모의 콘텐츠의 영역만큼으로 가져오지 못한다
            자신의 콘텐츠 크기만큼의 너비로 줄어든다
            기준요소?
            가까운 조상부터 position이 설정된 요소 (단, static 제외) 
            */
            left: 0;
            top: 0;
        }
        /* 모든 parent의 모든 child의 n번째 자식 */
        .parent .child:nth-child(1){
            background-color: #fff;
        }
        .parent .child:nth-child(2){
            background-color: #0dd;
        }
        .box{
            background-color: #dd0;
        }
        .parent:nth-child(5) .child{
            position: static;
        }
        /* 요소의 위치 설정법 지정 position */
    </style>
</head>
<body>
    <div class="wrap">
        <!-- .parent*5>.child*2>.box>{box$} -->
        <div class="parent">
            <div class="child">
                <div class="box">box1</div>
            </div>
            <div class="child">
                <div class="box">box2</div>
            </div>
        </div>
        <div class="parent">
            <div class="child">
                <div class="box">box1</div>
            </div>
            <div class="child">
                <div class="box">box2</div>
            </div>
        </div>
        <div class="parent">
            <div class="child">
                <div class="box">box1</div>
            </div>
            <div class="child">
                <div class="box">box2</div>
            </div>
        </div>
        <div class="parent">
            <div class="child">
                <div class="box">box1</div>
            </div>
            <div class="child">
                <div class="box">box2</div>
            </div>
        </div>
        <div class="parent">
            <div class="child">
                <div class="box">box1</div>
            </div>
            <div class="child">
                <div class="box">box2</div>
            </div>
        </div>
    </div>
</body>
</html>
