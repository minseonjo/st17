<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>swiper - wconcept</title>
    <link rel="stylesheet" href="../reset.css">
    <!-- 플러그인 설치 -->
    <!-- swiper js css -->
    <link
    rel="stylesheet"
    href="css/swiper.min.css"
    />
    
    <!-- swiper js script -->
    <script src="js/swiper-bundle.min.js"></script>
    <style>
        /* 
        1. swiper-slide 수평으로 나란하게
        문제 1-1 : 첫 번째 슬라이드만 보이고, 나머지는 보이지 않음 -> overflow: hidden;
        문제 1-2 : .swiper-slide 바로 옆에 나란히 보이지 않음 -> width: 100%;

        2. 1번 슬라이드가 브라우저 left: 0;가 아니라 기존 스킨의 너비에 맞춰서 시작했으면
        문제 2-1 : swiper는 브라우저 다 사용
        문제 2-2 : 슬라이드 진행은 기존 스킨의 너비만큼만

        3. swiper view에 3개의 slide가 표시되게 (3단)

        4. swiper-slide 후손인 img가 swiper-slide의 너비를 따르지 않는다
        -> swiper-slide>a, swiper-slide>a>img가 inline

        5. swiper-slide 사이에 여백을 주고 싶음
        -> 해결방법 : container한테 gap 주기 or item한테 margin 주기
        -> swiper 작동시 spaceBetween 사용
        문제 5-1 : swiper에서는 아이템간 여백을 margin-right로 지정

        6. 수평 스크롤바 없애기

        7. pagination의 type: "progressbar"로 변경

        8. progressbar의 위치를 swiper 아래로 이동
        문제 8-1 : 동일 요소에 top이 설정되어 있어서 자리가 bottom으로 이동하지 못함
        문제 8-2 : bottom: -값 주어서 .swiper 영역 밖으로 나갈 경우 사라지는 문제
        -> .visual-section이 overflow: hidden을 유지하면서 progressbar를 표시
        문제 8-3 : next, prev, play 버튼만큼 progressbar의 크기를 줄여야 함

        9. next, prev 버튼을 progressbar 오른쪽에 오도록
        문제 9-1 : swiper-button-prev, swiper-button-next 버튼 .swiper-wrapper의 자식으로 되어 있어서 개별 이동을 해야 함
        -> 하나로 묶기
        문제 9-2 : swiper-button-prev, swiper-button-next 버튼 개별 position: absolute를 없애고 자리 배치
        */

        /* 슬라이드의 위치를 확인 -> span 태그 */
        .visual-section .swiper-slide{
            /* swiper에 이미 설정되어 있음 */
            /* .visual-section .swiper-slide span 기준 요소 */
            position: relative;
        }
        .visual-section .swiper-slide span{
            /* 크기에 영향을 미치면 안 됨, 조상이 인식 못하게 만들기 위해 */
            position: absolute;
            left: 0;
            top: 0;
            background-color: #fff;
        }
        /* ↑ 슬라이드의 위치 확인 테스트 후 삭제  */

        .visual-section{
            /* 문제 9-2 해결 */
            /* .visual-section과 후손에서 사용될 변수 선언 */
            --swiper-control-bottom-position: -40px;
            
            /* 문제 2-1 해결 */
            /* 브라우저의 너비 다 사용 */
            width: 100% !important;
            max-width: 100% !important;

            /* 6 해결 */
            /* .visual-section .swiper의 overflow: visible; 변경한 후 */
            overflow: hidden;

            /* 문제 8-2 해결 : 자식(swiper) 높이 + 100px */
            padding-bottom: 80px;
        }
        .visual-section .swiper{
            /* 문제 1-1 해결 */
            overflow: visible;
            
            /* 3단 옆쪽에 넘쳐나는 부분이 보이지 않음 */
            /* swiper 영역 바깥으로 보이는 부분 보이지 않음 */
            /* overflow: hidden; */

            /* 문제 2-2 해결 */
            width: 92%;
            max-width: 1420px;

            /* cafe24 swiper css 버전 */
            /* .swiper-pagination-progressbar 기준 */
            position: relative;
            /* progressbar 가운데 정렬 */
            margin-left: auto;
            margin-right: auto;
        }
        .visual-section .swiper-wrapper{
            /* 5 해결 */
            /* gap: 20px; */
            /* 5. swiper 작동을 위해서는 gap을 지정하지 말고 spaceBetween 속성을 지정 */
        }
        .visual-section .swiper-slide{
            /* 문제 1-2 해결 */
            /* width: auto; */

            /* 3. 3단 해결 */
            /* width: 33.33%; */
            /* 3. swiper 사용하시면 slidesPerView를 이용하세요 */
        }
        .visual-section .swiper-slide>a{
            /* 4 해결 */
            /* 부모의 너비를 갖고 싶음 */
            display: block;
        }
        .visual-section .swiper-slide>a>img{
            /* 4 해결 */
            /* 이미지 요소의 특성 때문에 부모의 너비를 따라주는 것까지 추가로 작성해야 함 */
            display: block;
            width: 100%;
        }
        /* progressbar */
        .visual-section .swiper-pagination-progressbar{
            /* var(변수명, 기본값) */
            /* 앞에 있는 값에 해당되는 게 없으면 뒤에 있는 값(기본값)을 넣어라 */
            /* height: var(--swiper-pagination-progressbar-size, 4px); */
            /* height: auto; */
            top: 0;
            width: 100%;
            /* 8 progressbar의 위치를 swiper 아래로 이동 */
            bottom: -40px;
            /* 문제 8-1 해결 */
            /* 기존의 top값이 있다면 무력화시키기 위해서 */
            top: auto;
            
            /* 문제 8-3 해결 */
            /* calc() 둘 중 하나가 반드시 고정단위 */
            width: calc(100% - 120px);
            
            /* 문제 9-2 해결 */
            bottom: var(--swiper-control-bottom-position);
        }
        /* progressbar 색 바꾸기 */
        .visual-section .swiper-pagination-progressbar-fill{
            background-color: #434343;
        }
        .visual-section .swiper-button{
            /* 문제 9-2 해결 */
            position: absolute;
            right: 0px;
            bottom: var(--swiper-control-bottom-position);

            /* 자기 y축 크기의 반만큼 아래로 */
            transform: translate(0, 50%);
        }
        .visual-section .swiper-button>div{
            /* 문제 9-1 해결 */
            /* position: absolute를 무력화 */
            /* left, right, top, bottom 무력화 */
            position: static;
            /* 수평으로 오면서 너비, 높이를 지정하고 싶음 */
            /* 방법
            1. grid 2. flex 3. float 4. inline-block */
            display: inline-block;
            /* right: 50px; */
            width: 24px;
            height: 24px;

            /* 기준 */
            position: relative;

            /* left, right, top, bottom 값 무력화 */
            left: auto;
            right: auto;
            top: auto;
            bottom: auto;
        }
        .visual-section .swiper-button .swiper-button-prev,
        .visual-section .swiper-button .swiper-button-next{
            /* width: 24px;
            height: 24px; */
            padding-left: 10px;
            padding-right: 10px;

            /* 자동으로 생성되는 버튼 이미지 제거 */
            background-image: none;
        }
        /* naxt, prev 버튼 사이에 | 만들기 */
        .visual-section .swiper-button .swiper-button-prev::after{
            content: "";
            display: block;
            width: 2px;
            height: 60%;
            background-color: #ccc;
            position: absolute;
            right: 0;
            top: 50%;
            transform: translate(0, -50%);
        }
        .visual-section .swiper-button .swiper-button-prev>img,
        .visual-section .swiper-button .swiper-button-next>img{
            width: 100%;
            display: block;
        }
        /* .visual-section .swiper-button .swiper-button-next>img를 180도 회전 */
        .visual-section .swiper-button .swiper-button-next>img{
            transform: rotate(180deg);
        }
        .visual-section .swiper-button .swiper-button-play-toggle{}
        .visual-section .swiper-button .swiper-button-play-toggle>span{
            display: block;
            padding-left: 100%;
            background-repeat: no-repeat;
            background-size: contain;
            overflow: hidden;
        }
        .visual-section .swiper-button .swiper-button-play-toggle .icon-pause{
            background-image: url(images/pause_48dp.png);
        }
        .visual-section .swiper-button .swiper-button-play-toggle .icon-play{
            background-image: url(images/play_arrow_48dp.png);
        }
        /* 
        .swiper-button-play-toggle.is-play : pause 표시
        .swiper-button-play-toggle.is-pause : play 표시
        */
        .visual-section .swiper-button .swiper-button-play-toggle.is-pause .icon-pause,
        .visual-section .swiper-button .swiper-button-play-toggle.is-play .icon-play{
            display: none;
        }
    </style>
</head>
<body>
    <!-- Slider main container -->
    <div class="section visual-section">
        <div class="swiper swiper1">
            <!-- Additional required wrapper -->
            <div class="swiper-wrapper">
                <!-- Slides -->
                <div class="swiper-slide">
                    <a href="">
                        <img src="https://picsum.photos/400/500?random=1">
                        <span>1번 슬라이드</span>
                    </a>
                </div>
                <div class="swiper-slide">
                    <a href="">
                        <img src="https://picsum.photos/400/500?random=2">
                        <span>2번 슬라이드</span>
                    </a>
                </div>
                <div class="swiper-slide">
                    <a href="">
                        <img src="https://picsum.photos/400/500?random=3">
                        <span>3번 슬라이드</span>
                    </a>
                </div>
                <div class="swiper-slide">
                    <a href="">
                        <img src="https://picsum.photos/400/500?random=4">
                    </a>
                </div>
                <div class="swiper-slide">
                    <a href="">
                        <img src="https://picsum.photos/400/500?random=5">
                    </a>
                </div>
                <div class="swiper-slide">
                    <a href="">
                        <img src="https://picsum.photos/400/500?random=6">
                    </a>
                </div>
            </div>
            <!-- //.swiper-wrapper -->
            <!-- If we need pagination -->
            <div class="swiper-pagination"></div>

            <!-- 문제 9-1 해결 : 컨트롤 버튼의 위치를 편리하게 잡기 위해서 -->
            <div class="swiper-button">
                <!-- If we need navigation buttons -->
                <div class="swiper-button-prev">
                    <img src="images/arrow_back_ios_48dp.png" alt="이전 슬라이드로 이동">
                </div>
                <div class="swiper-button-next">
                    <img src="images/arrow_back_ios_48dp.png" alt="다음 슬라이드로 이동">
                </div>
                <!-- play와 pause 버튼이 올 거예요 -->
                <div class="swiper-button-play-toggle is-play">
                    <span id="icon-pause" class="icon-pause">pause</span>
                    <span id="icon-play" class="icon-play">play</span>
                </div>
            </div>
            <!-- //.swiper-button -->

            <!-- If we need scrollbar -->
            <!-- pagination type: "progressbar"로 지정했기 때문에 스크롤바 삭제 -->
            <!-- <div class="swiper-scrollbar"></div> -->
        </div>
        <!-- //.swiper -->
    </div>
    <!-- //.visual-section -->
    <!-- swiper 실행 -->
    <script>
        const swiper = new Swiper('.swiper', {
            // Optional parameters
            direction: 'horizontal',

            // 무한 반복
            loop: true,

            // 현재 슬라이드가 swiper 안에 가운데 오게끔
            // swiper 시작할 때 1번 슬라이드 왼쪽에 마지막 슬라이드 표시
            centeredSlides: true,

            // 3번(3단)을 위해서 추가
            // swiper 안에 몇 개 slide를 보여줄지 결정
            slidesPerView: 3,

            // 5번(여백)을 위해서 추가
            // swiper에서는 아이템간 여백을 margin-right로 지정
            // 단위 쓰지 X
            spaceBetween: 20,

            // If we need pagination
            pagination: {
                el: '.swiper-pagination',
                clickable: true,
                // 7 해결
                // type: "bullets(기본값)", "fraction", "progressbar"
                type: "progressbar",
            },

            // Navigation arrows
            navigation: {
                // 클래스명 바꿔도 무방
                nextEl: '.swiper-button-next',
                prevEl: '.swiper-button-prev',
                // 내가 입력한 html img 태그 이미지 사용
                addIcons: false,
            },

            // And if we need scrollbar
            // progressbar일 때 삭제
            // scrollbar: {
            //     el: '.swiper-scrollbar',
            // },
        });
    </script>
</body>
</html>
