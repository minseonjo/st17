<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flex4 - flex item</title>
    <link rel="stylesheet" href="../reset.css">
    <style>
        /* 
        1. flex 선언 container
        2. flex의 방향을 결정 container row가 기본값
        3. 아이템의 확장/축소를 결정 item 확장 X, 축소 O
        4. 아이템의 크기 결정 item
        5. 아이템이 줄바꿈을 결정 container
        6. 여백 관리 gap container margin item
        7. 정렬 container / item, margin
        */
        .wrap{margin: 50px;}
        .container{
            background-color: #fcc;
        }
        .item{
            border: 1px solid #000;
        }
        .flex{
            display: flex;
            /* 2 방향 */
            /* flex-direction: row; */
            /* 5 줄바꿈 */
            /* flex-wrap: nowrap; */
            /* 6 여백 */
            /* gap: 0; */
            /* 7 정렬 */
            /* 주축 justify-content */
            /* justify-content: flex-start; */
            /* 교차축 align-content */
            /* align-content: stretch; */
        }
        .flex .item{
            /* 3 */
            /* flex-grow: 0; */
            flex-grow: 1;
            /* flex-shrink: 1; */
            flex-shrink: 0;
            /* flex의 기준 단위 */
            /* flex-basis: auto; */
            /* 4 */
            /* width: auto; */
            /* height: auto; */
        }
        /* .flex .item:nth-child(1){flex-grow: 2;}
        .flex .item:nth-child(2){flex-grow: 8;}
        .flex .item:nth-child(3){flex-grow: 1;}
        .flex .item:nth-child(4){flex-grow: 1;} */
    </style>
</head>
<body>
    <div class="wrap">
        <!-- .container>.item*4>{item$} -->
        <div class="container flex">
            <div class="item">item1</div>
            <div class="item">item2</div>
            <div class="item">item3</div>
            <div class="item">item4</div>
        </div>
    </div>
</body>
</html>
