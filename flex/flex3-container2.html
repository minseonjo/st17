<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flex3 - flex container2</title>
    <link rel="stylesheet" href="../reset.css">
    <style>
        /* 
        flex container 속성을 실습을 위해서
        아이템의 확장 X, 축소 X
        */
        /* 
        1. flex 선언 container
        2. flex의 방향을 결정 container
        3. 아이템의 확장/축소를 결정 item
        4. 아이템의 크기 결정 item
        5. 아이템이 줄바꿈을 결정 container
        6. 여백 관리 gap container margin item
        7. 정렬 container / item, margin
        */
        .wrap{margin: 50px;}
        .container{
            background-color: #fcc;
        }
        .item{
            border: 1px solid #000;
        }
        .flex1{
            width: 300px;
            height: 150px;
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            column-gap: 1rem;
            row-gap: 10px;
            justify-content: start;
            align-content: start;
            margin-bottom: 50px;
        }
        .flex1 .item{
            flex-grow: 0;
            flex-shrink: 0;
            width: 80px;
        }

        /* flex2 */
        .flex2{
            /* 1 */
            display: flex;
            /* 실습을 위해서 */
            width: 300px;
            height: 150px;
            /* 2 아이템이 진행하는 방향 */
            /* flex-direction: row; */
            flex-direction: column;
            /* 
            5 아이템의 합이 부모의 컨테이너의 크기보다 클 경우
            아이템에 flex-shrink: 0; 설정
            */
            flex-wrap: wrap;
            /* 6 여백 관리 */
            /* gap과 justify-content를 함께 지정하면 원하는 레이아웃이 안 나올 수 있음 */
            /* gap: 1rem; */
            /* 7 정렬*/
            /* 주축 정렬 */
            justify-content: space-evenly;
            /* 교차축의 정렬 */
            align-content: space-evenly
        }
        .flex2 .item{
            /* 3 */
            flex-grow: 0;
            flex-shrink: 0;
            /* 4 width bias */
            width: 80px;
            /* 단처리를 위한 % */
            /* width: calc(33.33% - (1rem * (3 - 1) / 3)); */
            /* 높이를 지정하지 않으면 기본적으로  */
            height: 60px;
            box-sizing: border-box;
        }
    </style>
</head>
<body>
    <div class="wrap">
        <!-- .container>.item*4>{item$} -->
        <div class="container flex1">
            <div class="item">item1</div>
            <div class="item">item2</div>
            <div class="item">item3</div>
            <div class="item">item4</div>
        </div>
        <div class="container flex2">
            <div class="item">item1</div>
            <div class="item">item2</div>
            <div class="item">item3</div>
            <div class="item">item4</div>
        </div>
    </div>
</body>
</html>
