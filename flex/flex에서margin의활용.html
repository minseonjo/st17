<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flex에서 margin의 활용</title>
    <link rel="stylesheet" href="../reset.css">
    <style>
        .container{
            background-color: #ccc;
            width: 100%;
            height: 100vh;

            display: flex;
            /* 2 flex-direction: row; */
            /* 5 nowrap */
            /* 6 gap */
            /* 7 정렬 */
            /* 주축 */
            justify-content: flex-start;
            /* 
            교차축
            align-items: stretch; 
            교차크기(아이템의 width, height): auto;
            */
        }
        .item{
            /* width: 100px; */
            /* height: 100px; */
            background-color: magenta;
            /* 3 확장 0 / 축소 1 */
            /* 4 크기 flex-basis: auto; */
            /* 
            width: auto;
            flex item이 나의 내용 크기만큼 되겠다 
            flex item이 stretch일 경우 부모의 크기만큼 늘어나라, 이걸 제외하고는 내 내용 크기
            */
            width: 100px;
            height: 100px;
            /* 6 margin */
            /* margin-top: auto; */
            /* flex 컨테이너의 남은 공간을 바깥 여백으로 사용 */
            margin: auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item">아이템</div>
    </div>
</body>
</html>
