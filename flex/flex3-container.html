<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flex3 - flex container</title>
    <link rel="stylesheet" href="../reset.css">
    <style>
        /* 
        flex container 속성을 실습을 위해서
        아이템의 확장 X, 축소 X
        */
        /* 
        1. flex 선언 container
        2. flex의 방향을 결정 container
        3. 아이템의 확장/축소를 결정 item
        4. 아이템의 크기 결정 item
        5. 아이템이 줄바꿈을 결정 container
        6. 여백 관리 gap container margin item
        7. 정렬 container / item, margin
        */
        .wrap{margin: 50px;}
        .container{
            background-color: #fcc;
        }
        .item{
            border: 1px solid #000;
        }
        .flex{
            width: 300px;
            /* 높이는 자식으로부터 */
            /* height: auto; */
            height: 300px;
            /* 1. flex container 선언 : 단이 될 요소의 부모에게 */
            display: flex;
            /* 2. flex의 방향을 결정 : container 주축, 교차축 결정 */
            flex-direction: row;
            /* 전제조건 : 아이템 확장?, 아이템 축소 X */
            /*
            5. flex-wrap 
            flex 컨테이너 안에서 flex 아이템의 합이 flex 컨테이너보다 클 경우 줄바꿈 
            */
            flex-wrap: wrap;
            /* 6. 여백 관리 gap container margin item */
            /* 
            gap, justify-content, align-content를 같이 지정하면 원하는 레이아웃을 못 얻을 수 있다
            (start로 주는 경우 많음)
            */
            column-gap: 1rem;
            row-gap: 10px;
            /* 7. 정렬 container / item, margin */
            /* 7-1. 주축의 정렬 */
            /* 요소의 양 끝에 주는 여백이 동일 */
            /* justify-content: space-around; */
            /* 요소와 요소 사이에만 동등하게 여백 배치 */
            /* justify-content: space-between; */
            /* 부모와 요소 사이의 여백, 요소와 요소 사이의 여백 동일하게, 양끝정렬  */
            /* justify-content: space-evenly; */
            justify-content: start;
            /* 7-2. 교차축의 정렬 */
            /* 7-2-1. 여러줄의 정렬 align-content */
            /* 7-2-2. 한줄의 정렬 align-items */
            /* 기본값 : flex 컨테이너의 교차축 크기에 맞춰서 늘어나라 */
            /* align-content: stretch; */
            /* 양끝정렬 */
            /* align-content: space-between; */
            align-content: start;
        }
        .flex .item{
            /* 3. 아이템의 확장/축소를 결정 item */
            flex-grow: 0;
            flex-shrink: 0;
            /* 4. 아이템의 크기 결정 item */
            width: 80px;
        }
    </style>
</head>
<body>
    <div class="wrap">
        <!-- .container>.item*4>{item$} -->
        <div class="container flex">
            <div class="item">item1</div>
            <div class="item">item2</div>
            <div class="item">item3</div>
            <div class="item">item4</div>
        </div>
    </div>
</body>
</html>
