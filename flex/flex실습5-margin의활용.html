<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flex 실습5 - margin의 활용</title>
    <link rel="stylesheet" href="../reset.css">
    <style>
        /* 모양 */
        .inner{background-color: #ccc;}
        #top_nav_box{background-color: #fcc; box-sizing: border-box;}
        #top_nav_box>div{box-sizing: border-box; padding: 0.5rem;}
        #top_nav_box .top_logo{background-color: beige;}
        #top_nav_box .top_category{background-color: dodgerblue;}
        #top_nav_box .top_mypage{background-color: purple;}

        /* 크기 */
        /* #top_nav_box .top_logo{width: 100px;}
        #top_nav_box .top_category{min-width: 600px; max-width: 700px;}
        #top_nav_box .top_mypage{width: 150px;} */

        /* flex */
        .inner{
            display: flex;
            /* 
            2 방향 row
            5 줄바꿈 nowrap
            */
        }
        #top_nav_box{
            /* flex item */
            /* 
            3 확장 0 / 축소 1 
            4 flex-basis: auto;
            */
            width: 100%;

            /* flex container */
            display: flex;
            /* 
            2 방향 row
            5 줄바꿈 nowrap
            */
            /* 7 정렬 */
            justify-content: flex-start;
        }
        #top_nav_box>div{
            /* flex item */
            /* 
            3 확장 0 / 축소 1
            4 flex-basis: auto;
            */
        }
        #top_nav_box .top_logo{width: 100px;}
        #top_nav_box .top_category{min-width: 600px; max-width: 700px;}
        /* justify-content: flex-start; 하고 flex 컨테이너에 남은 공간을 .top_mypage의 왼쪽 바깥 여백으로 사용 */
        #top_nav_box .top_mypage{width: 150px; margin-left: auto;}
    </style>
</head>
<body>
    <div class="inner">
        <div class="top_nav_box" id="top_nav_box">
            <div class="top_logo">로고</div>
            <div class="top_category">카테고리</div>
            <div class="top_mypage">마이페이지</div>
        </div>
    </div>
</body>
</html>
